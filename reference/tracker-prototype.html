<title>Tyndale Degree Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Spectral:wght@500;600&display=swap">
<style>
/* Layout: one 960px column; sticky app bar with tabs; requirement blocks read like a program sheet, rows as checklist lines */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#eef1f6; --line:#dde2ea; --line-2:#c9d0db;
  --fg:#141821; --muted:#5a6372; --faint:#8a93a2;
  --accent:#24448f; --accent-ink:#ffffff; --accent-soft:#e3e9f7;
  --done:#1f7a4f; --done-soft:#dff2e8; --prog:#a3620b; --prog-soft:#fbefd9; --plan:#4a55b8; --plan-soft:#e7e9fb;
  --hol:#b03a48; --hol-soft:#f8e3e6; --exam:#7a4bb3; --exam-soft:#efe6f9;
  --shadow:0 1px 2px rgba(20,24,33,.06),0 4px 16px rgba(20,24,33,.05);
  --f-display:"Spectral",Georgia,"Times New Roman",serif;
  --f-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --surface:#151a21; --surface-2:#1b212a; --line:#252c37; --line-2:#323b48;
  --fg:#e7eaf0; --muted:#9aa3b1; --faint:#6d7685;
  --accent:#8fb0ff; --accent-ink:#0e1116; --accent-soft:#1d2840;
  --done:#56c98e; --done-soft:#14291f; --prog:#e6a64a; --prog-soft:#2b2214; --plan:#a3abff; --plan-soft:#1f2240;
  --hol:#f07f8c; --hol-soft:#2d1a1e; --exam:#c39af0; --exam-soft:#251c33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1116; --surface:#151a21; --surface-2:#1b212a; --line:#252c37; --line-2:#323b48;
  --fg:#e7eaf0; --muted:#9aa3b1; --faint:#6d7685;
  --accent:#8fb0ff; --accent-ink:#0e1116; --accent-soft:#1d2840;
  --done:#56c98e; --done-soft:#14291f; --prog:#e6a64a; --prog-soft:#2b2214; --plan:#a3abff; --plan-soft:#1f2240;
  --hol:#f07f8c; --hol-soft:#2d1a1e; --exam:#c39af0; --exam-soft:#251c33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:-.01em}
.muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3{text-wrap:balance;margin:0}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* app bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.sync{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync[data-s="saved"] i{background:var(--done)} .sync[data-s="saving"] i{background:var(--prog)} .sync[data-s="local"] i{background:var(--hol)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.iconbtn:hover{border-color:var(--line-2)}

.notice{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--prog-soft);color:var(--fg);font-size:13.5px;border:1px solid color-mix(in srgb,var(--prog) 30%,transparent)}

/* summary */
.summary{margin-top:22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end}
.summary h1{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,4.4vw,36px);line-height:1.1;letter-spacing:-.015em}
.summary .sub{margin-top:6px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.bignum{text-align:right;font-variant-numeric:tabular-nums}
.bignum b{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1}
.bignum span{color:var(--muted);font-size:14px}
.meter{grid-column:1/-1;display:flex;flex-direction:column;gap:8px}
.track{height:10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.track>div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend b{color:var(--fg);font-weight:600}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.stat .v small{font-weight:500;color:var(--muted);font-size:13px}
@media (max-width:560px){.summary{grid-template-columns:1fr}.bignum{text-align:left}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}

/* sections */
.section-h{margin-top:34px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--fg)}
.section-h h2{font-family:var(--f-display);font-weight:600;font-size:22px}
.section-h a{margin-left:auto;font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
.section-h a:hover{text-decoration:underline}
.block{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.block-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.block-h h3{font-size:15px;font-weight:700}
.block-h .cr{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{width:70px;height:6px;border-radius:9px;background:var(--line);overflow:hidden;flex:none}
.mini>div{height:100%;background:var(--done)}
.rows{display:flex;flex-direction:column}
.row{padding:10px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row:first-child{border-top:0}
.row-label{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row-label .count{font-variant-numeric:tabular-nums;font-weight:500}

.course{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.course .ct{min-width:0}
.course .code{font-family:var(--f-mono);font-size:13px;font-weight:500}
.course .title{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
.course .crs{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.x{border:0;background:transparent;color:var(--faint);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--hol);background:var(--hol-soft)}

.pill{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;font-size:12px;font-weight:600;padding:4px 10px;min-width:96px;text-align:left;display:inline-flex;align-items:center;gap:6px;color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none}
.pill[data-s="p"]{background:var(--plan-soft);color:var(--plan);border-color:transparent}
.pill[data-s="i"]{background:var(--prog-soft);color:var(--prog);border-color:transparent}
.pill[data-s="i"]::before{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.pill[data-s="d"]{background:var(--done-soft);color:var(--done);border-color:transparent}
.pill[data-s="d"]::before{background:currentColor}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--line-2);background:transparent;border-radius:7px;padding:4px 9px;font-family:var(--f-mono);font-size:12.5px;color:var(--fg);display:inline-flex;gap:6px;align-items:baseline;max-width:100%}
.chip em{font-style:normal;font-family:var(--f-ui);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.chip:hover{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:12.5px;padding:0}
.slot{display:flex;gap:8px;align-items:center}
.slot input{flex:1;min-width:0;border:1px dashed var(--line-2);background:transparent;border-radius:8px;padding:7px 10px;font-size:13.5px}
.slot input:focus{border-style:solid;border-color:var(--accent);outline:none}
.freebar{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--muted)}
.freelist{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--f-mono);font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.notes{margin-top:14px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;padding-left:18px}

/* catalog */
.toolbar{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.field{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;min-width:0}
.field:focus{outline:none;border-color:var(--accent)}
.toolbar .field.grow{flex:1 1 240px}
.cat{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.cat .course{padding:10px 16px;border-top:1px solid var(--line)}
.cat .course:first-child{border-top:0}
.regc{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* calendar */
.cal-top{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.cal-top{grid-template-columns:1fr}}
.next{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.next .eyebrow{color:inherit;opacity:.8}
.next .what{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.2}
.next .when{font-size:13.5px;opacity:.85}
.count-down{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.termcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.month{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.month-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.month-h h3{font-family:var(--f-display);font-size:20px;font-weight:600;margin-right:auto;padding-left:4px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
.day{min-height:92px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 6px;display:flex;flex-direction:column;gap:3px;background:transparent;border-top:0;border-left:0;text-align:left;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--surface-2)} .day.out .dn{color:var(--faint)}
.day .dn{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px;align-self:flex-start}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.ev{font-size:11px;line-height:1.25;padding:1px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--surface-2);color:var(--fg)}
.ev.holiday{background:var(--hol-soft);color:var(--hol)} .ev.exam{background:var(--exam-soft);color:var(--exam)}
.ev.deadline{background:var(--prog-soft);color:var(--prog)} .ev.term{background:var(--accent-soft);color:var(--accent)}
.ev.cls{background:var(--plan-soft);color:var(--plan)} .ev.mine{background:var(--done-soft);color:var(--done)}
.more{font-size:11px;color:var(--muted)}
@media (max-width:600px){.day{min-height:54px}.ev{font-size:0;height:5px;padding:0;border-radius:3px}.dow{padding:6px 4px;font-size:10px}}
.daypanel{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.daypanel h3{font-size:15px;margin-bottom:8px}
.ag{display:flex;flex-direction:column}
.ag-i{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline;font-size:14px}
.ag-i:first-child{border-top:0}
.ag-i .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.two{margin-top:18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days label{flex-direction:row;align-items:center;gap:0}
.days input{position:absolute;opacity:0;pointer-events:none}
.days span{border:1px solid var(--line-2);border-radius:7px;padding:5px 9px;font-size:12.5px;color:var(--fg);font-weight:600;cursor:pointer}
.days input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:8px;padding:9px 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-2)}
.btn.danger{background:var(--hol);color:#fff}
.err{color:var(--hol);font-size:12.5px}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.li:first-of-type{border-top:0}
.li small{display:block;color:var(--muted);font-size:12.5px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(5vh,16px) 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:520px;width:100%;padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.modal h2{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.15}
.modal p{margin:0;color:var(--muted);font-size:14px}
.modal label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.modal .field{width:100%}
.acct{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.acct b{color:var(--fg)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
footer{margin-top:40px;font-size:12.5px;color:var(--faint);line-height:1.6}
footer a{color:var(--muted)}
.skel{margin-top:40px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.track>div,.mini>div{transition:width .35s ease}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="brand"><b>Degree Tracker</b><span id="who">Tyndale University · 2026–27</span></div>
    <nav class="tabs" role="tablist" aria-label="Pages">
      <button class="tab" role="tab" id="tab-degree" data-tab="degree" aria-selected="true">Degree</button>
      <button class="tab" role="tab" id="tab-cal" data-tab="cal" aria-selected="false">Calendar</button>
      <button class="tab" role="tab" id="tab-courses" data-tab="courses" aria-selected="false">Courses</button>
    </nav>
    <span class="sync" id="sync" data-s="loading"><i></i><span>Connecting…</span></span>
    <button class="iconbtn" id="settingsBtn" data-act="settings">Settings</button>
  </div>
</header>
<main class="wrap" id="app"><p class="skel">Loading your tracker…</p></main>

<script>
(function(){
"use strict";
// ---------- catalog
const CAT = new Map(CATALOG.map(([c,t])=>[c,t]));
const cr = c => CREDIT_OVERRIDES[c] ?? 3;
const lvl = c => { const m = /^[A-Z]{4} (\d)/.exec(c); return m ? +m[1] : 0; };
const title = c => CAT.get(c) || "Title not in the online catalog";
const shown = c => c.replace(/-[A-Z]{3}$/,"");
const regCode = c => /^[A-Z]{4} \d{3}$/.test(c) ? c.replace(" ","") + cr(c) : "";
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const PROG = new Map(PROGRAMS.map(p=>[p.id,p]));
const MIN = new Map(MINORS.map(m=>[m.id,m]));
const CONC = new Map(CONCENTRATIONS.map(c=>[c.id,c]));
const STATUS = {"":"Not started", p:"Planned", i:"In progress", d:"Done"};
const NEXT = {"":"p", p:"i", i:"d", d:""};

// ---------- state
const blank = () => ({v:1, name:"", program:"", minor:"", conc:"", status:{}, choice:{}, classes:[], events:[], updated:0});
let S = blank();
let ui = {tab:"degree", q:"", subj:"", filter:"", month:null, sel:null, showAll:{}, openSettings:false, confirmReset:false, err:""};
try{ const t = localStorage.getItem("tdt-tab"); if(t) ui.tab = t; }catch(e){}
const LKEY = "tdt-state-v1";
function loadLocal(){ try{ const j = localStorage.getItem(LKEY); return j ? JSON.parse(j) : null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LKEY, JSON.stringify(S)); }catch(e){} }

// ---------- persistence (db per user, private subtree)
let mode = "loading", ref = null, saving = false, dirty = false, timer = null, readOnly = false;
function setSync(s, text){ const el = document.getElementById("sync"); el.dataset.s = s; el.lastElementChild.textContent = text; }
function changed(){
  S.updated = Date.now(); saveLocal(); render();
  if(mode !== "cloud") return;
  dirty = true; setSync("saving","Saving…");
  clearTimeout(timer); timer = setTimeout(flush, 600);
}
async function flush(){
  if(saving || !dirty || !ref) return;
  saving = true; dirty = false;
  try{ await ref.set({json: JSON.stringify(S), updated: S.updated}); setSync("saved","Saved to your account"); }
  catch(e){
    if(e && e.code === "invalid_argument"){ mode = "local"; readOnly = true; setSync("local","Not saving"); render(); }
    else if(e && e.code === "unavailable"){ dirty = true; setTimeout(flush, 1500 + Math.random()*1500); setSync("saving","Retrying…"); }
    else { dirty = true; setSync("local","Couldn’t save"); }
  }
  saving = false;
  if(dirty) flush();
}
async function connect(){
  const local = loadLocal(); if(local) S = Object.assign(blank(), local);
  render();
  const api = window.claude && window.claude.use ? window.claude : null;
  let db = null, user = null, uid = null;
  if(api){ try{ [db, user] = await Promise.all([api.use("db"), api.use("user")]); }catch(e){} }
  if(user){ try{ uid = await user.id(); }catch(e){} }
  if(!db || !uid){ mode = "local"; setSync("local","This device only"); render(); return; }
  let lastUid = null; try{ lastUid = localStorage.getItem("tdt-uid"); localStorage.setItem("tdt-uid", uid); }catch(e){}
  if(lastUid && lastUid !== uid){ S = blank(); saveLocal(); render(); }
  ref = db.doc("data/users/" + uid + "/profile");
  let first = true;
  ref.onSnapshot(snap => {
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists){
      const d = snap.data();
      const remoteU = (d && d.updated) || 0;
      if(d && typeof d.json === "string" && remoteU > (S.updated||0) && !dirty){
        try{ S = Object.assign(blank(), JSON.parse(d.json)); saveLocal(); render(); }catch(e){}
      } else if(first && (S.updated||0) > remoteU && S.program){ dirty = true; flush(); }
      if(first){ mode = "cloud"; setSync("saved","Saved to your account"); render(); }
    } else if(first){
      mode = "cloud"; setSync("saved","Saved to your account");
      if(S.program){ dirty = true; flush(); }
      render();
    }
    first = false;
  }, err => { mode = "local"; setSync("local","This device only"); render(); });
}

// ---------- requirement logic
function rowCodes(row){ return typeof row === "string" ? [row] : (row.of || row.pool || []); }
function effChoice(row, key){
  const explicit = (S.choice[key] || []).slice();
  if(row.el) return explicit;
  const opts = row.of || row.pool || [];
  const cap = row.pick || Infinity;
  for(const o of opts){ if(explicit.length >= cap) break; if(S.status[o] && !explicit.includes(o)) explicit.push(o); }
  return explicit.filter(c => opts.includes(c)).slice(0, cap);
}
function rowCourses(row, key){ if(typeof row === "string") return [row]; if(row.free) return []; return effChoice(row, key); }
function rowTarget(row){ if(typeof row === "string") return cr(row); if(row.free) return row.free; if(row.el) return row.cr; if(row.pick) return row.cr || row.pick*3; return row.cr || 0; }
function sections(){
  const out = [];
  const p = PROG.get(S.program); if(!p) return out;
  out.push({kind:"Major", key:p.id, title:p.cred + " " + p.name, pdf:p.pdf, blocks:p.blocks.map(b=>({t:b[0], cr:b[1], rows:b[2]})), notes:p.notes||[], year:p.sheetYear});
  const c = CONC.get(S.conc); if(c && (p.conc||[]).includes(c.id)) out.push({kind:"Concentration", key:c.id, title:c.name + " concentration", pdf:c.pdf, blocks:[{t:"Concentration requirements", cr:c.total, rows:c.rows}], notes:c.note?[c.note]:[]});
  const m = MIN.get(S.minor); if(m) out.push({kind:"Minor", key:m.id, title:m.name + " minor", pdf:m.pdf, blocks:[{t:"Minor requirements", cr:m.total, rows:m.rows}], notes:m.note?[m.note]:[]});
  return out;
}
function compute(){
  const secs = sections();
  const used = new Set();
  secs.forEach(s => s.blocks.forEach((b,bi) => b.rows.forEach((r,ri) => rowCourses(r, s.key+":"+bi+":"+ri).forEach(c=>used.add(c)))));
  const all = Object.keys(S.status).filter(c => S.status[c]);
  const sum = st => all.filter(c=>S.status[c]===st).reduce((a,c)=>a+cr(c),0);
  const leftoverDone = all.filter(c=>S.status[c]==="d" && !used.has(c));
  const leftoverAny = all.filter(c=>!used.has(c));
  let freePool = leftoverDone.reduce((a,c)=>a+cr(c),0);
  const freeFill = {};
  secs.forEach(s => s.blocks.forEach((b,bi) => b.rows.forEach((r,ri) => { if(r.free){ const k=s.key+":"+bi+":"+ri; const take=Math.min(r.free, freePool); freeFill[k]=take; freePool-=take; } })));
  return {secs, done:sum("d"), prog:sum("i"), plan:sum("p"), upper: all.filter(c=>S.status[c]==="d" && lvl(c)>=3).reduce((a,c)=>a+cr(c),0), leftoverAny, freeFill};
}
function blockDone(s, b, bi, C){
  let n = 0;
  b.rows.forEach((r,ri) => {
    const k = s.key+":"+bi+":"+ri;
    if(r.free){ n += C.freeFill[k]||0; return; }
    let got = rowCourses(r,k).filter(c=>S.status[c]==="d").reduce((a,c)=>a+cr(c),0);
    if(r.el || r.pick || r.cr) got = Math.min(got, rowTarget(r));
    n += got;
  });
  return Math.min(n, b.cr);
}

// ---------- render helpers
function pill(code){ const s = S.status[code]||""; return `<button class="pill" data-act="cycle" data-code="${esc(code)}" data-s="${s}" aria-label="${esc(shown(code))}: ${STATUS[s]}. Change status">${STATUS[s]}</button>`; }
function courseLine(code, rm){
  return `<div class="course">${pill(code)}<div class="ct"><span class="code">${esc(shown(code))}</span> <span class="title">${esc(title(code))}</span></div><span class="crs">${cr(code)} cr${rm?`<button class="x" title="Remove" aria-label="Remove ${esc(shown(code))}" data-act="unchoose" data-key="${rm}" data-code="${esc(code)}">×</button>`:""}</span></div>`;
}
function chip(code, key, act){ return `<button class="chip" data-act="${act||"choose"}" data-key="${key}" data-code="${esc(code)}" title="${esc(title(code))}">${esc(shown(code))}<em>${esc(title(code))}</em></button>`; }
function rowHTML(s, r, key, C){
  if(typeof r === "string") return `<div class="row">${courseLine(r)}</div>`;
  if(r.free){
    const fill = C.freeFill[key]||0;
    const list = C.leftoverAny;
    return `<div class="row"><div class="freebar"><div class="mini" style="width:120px"><div style="width:${Math.round(fill/r.free*100)}%"></div></div><span><b style="color:var(--fg)">${fill}</b> of ${r.free} cr. Filled automatically by courses you mark that don’t count elsewhere.</span></div>${list.length?`<div class="freelist">${list.map(c=>`<span class="tag" title="${esc(title(c))} · ${STATUS[S.status[c]]}">${esc(shown(c))}</span>`).join("")}</div>`:`<span class="faint" style="font-size:13px">Add courses from the Courses tab to fill this.</span>`}</div>`;
  }
  const chosen = effChoice(r, key);
  if(r.el){
    const slots = Math.max(1, Math.ceil(r.cr/3));
    const empty = Math.max(0, slots - chosen.length);
    let h = `<div class="row"><div class="row-label">${esc(r.el)} <span class="count">· ${r.cr} cr</span>${r.hint?`<span class="faint">· ${esc(r.hint)}</span>`:""}</div>`;
    h += chosen.map(c=>courseLine(c, key)).join("");
    for(let i=0;i<empty;i++) h += `<div class="slot"><input list="allc" id="slot-${key}-${i}" placeholder="Add a course, e.g. ${esc(suggest(r))}" data-act="slot" data-key="${key}" autocomplete="off" aria-label="Add a course for ${esc(r.el)}"></div>`;
    return h + `</div>`;
  }
  const isPick = !!r.pick;
  const label = r.label || (isPick ? `Choose ${r.pick===1?"one":r.pick}` : "Choose from");
  const full = isPick && chosen.length >= r.pick;
  const show = !full || ui.showAll[key];
  const opts = rowCodes(r).filter(c=>!chosen.includes(c));
  let h = `<div class="row"><div class="row-label">${esc(label)} <span class="count">· ${isPick? chosen.length+" of "+r.pick+" chosen" : rowTarget(r)? rowTarget(r)+" cr" : "counts toward block"}</span>${full?`<button class="linkbtn" data-act="toggleopts" data-key="${key}">${ui.showAll[key]?"Hide options":"Change"}</button>`:""}</div>`;
  h += chosen.map(c=>courseLine(c, (S.choice[key]||[]).includes(c)?key:"")).join("");
  if(show && opts.length) h += `<div class="chips">${opts.map(c=>chip(c,key)).join("")}</div>`;
  return h + `</div>`;
}
function suggest(r){ const m = /([A-Z]{4})/.exec(r.el + " " + (r.hint||"")); return m ? m[1]+" 3xx" : "PSYC 101"; }

function renderDegree(){
  const p = PROG.get(S.program);
  if(!p) return `<div class="empty" style="margin-top:40px">Choose your program to see your requirements. <button class="btn" data-act="settings" style="margin-left:8px">Choose program</button></div>`;
  const C = compute();
  const tot = p.total, pct = v => Math.min(100, v/tot*100);
  const m = MIN.get(S.minor);
  let h = `<section class="summary">
    <div><div class="eyebrow">${esc(S.name ? S.name + "’s degree" : "Your degree")}</div><h1>${esc(p.cred)} in ${esc(p.name)}</h1>
    <div class="sub"><span>${m?esc(m.name)+" minor":"No minor"}</span>${CONC.get(S.conc)&&(p.conc||[]).includes(S.conc)?`<span>${esc(CONC.get(S.conc).name)} concentration</span>`:""}<span>Min. GPA ${esc(p.gpa)}</span><span>${p.sheetYear?esc(p.sheetYear):"2026–27"} program sheet</span></div></div>
    <div class="bignum"><b>${C.done}</b><span> / ${tot} credit hours</span></div>

// ---------- calendar
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const NOCLASS = new Set();
TYNDALE_DATES.forEach(([a,b,,t]) => { if(t!=="holiday") return; for(let d=parseD(a); d<=parseD(b); d.setDate(d.getDate()+1)) NOCLASS.add(ymd(d)); });
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function fmtTime(t){ if(!t) return ""; const [h,m] = t.split(":").map(Number); return ((h%12)||12)+":"+pad(m)+(h<12?" am":" pm"); }
function itemsOn(ds){
  const out = [];
  TYNDALE_DATES.forEach(([a,b,n,t]) => { if(ds>=a && ds<=b) out.push({kind:t, text:n, time:""}); });
  const d = parseD(ds), w = d.getDay();
  S.classes.forEach(c => { const term = TERMS.find(t=>t.id===c.term); if(!term) return; if(ds>=term.start && ds<=term.end && c.days.includes(w) && !NOCLASS.has(ds)) out.push({kind:"cls", text:shown(c.code)+(c.room?" · "+c.room:""), time:c.start, end:c.end, sub:title(c.code)}); });
  S.events.forEach(e => { if(e.date===ds) out.push({kind:"mine", text:e.title, time:e.time||""}); });
  return out.sort((a,b)=>(a.time||"00:00").localeCompare(b.time||"00:00"));
}
function nextUp(){
  const now = new Date();
  for(let i=0;i<240;i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()+i), ds = ymd(d);
    const items = itemsOn(ds).filter(x=>x.kind==="cls"||x.kind==="mine"||x.kind==="deadline"||x.kind==="exam"||x.kind==="term");
    for(const it of items){
      const [h,m] = (it.time||"09:00").split(":").map(Number);
      const at = new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m);
      if(at > now) return {it, at};
    }
  }
  return null;
}
function countdown(at){
  let s = Math.max(0, Math.floor((at - new Date())/1000));
  const d = Math.floor(s/86400); s%=86400; const h = Math.floor(s/3600); s%=3600; const m = Math.floor(s/60); s%=60;
  return (d?d+"d ":"")+pad(h)+"h "+pad(m)+"m "+pad(s)+"s";
}
function termProgress(){
  const now = ymd(new Date());
  const t = TERMS.find(t=>now<=t.end) || TERMS[TERMS.length-1];
  const s = parseD(t.start), e = parseD(t.end), n = new Date();
  const pct = Math.max(0, Math.min(100, (n-s)/(e-s)*100));
  const days = Math.ceil((e - n)/86400000);
  const label = n < s ? `Starts in ${Math.ceil((s-n)/86400000)} days` : days >= 0 ? `${days} days of classes left` : "Finished";
  return {t, pct, label};
}

const DL = CATALOG.map(([c,t])=>`<option value="${shown(c).replace(/"/g,"")} — ${t.replace(/"/g,"'")}"></option>`).join("");
function codeFromInput(v){
  v = (v||"").trim(); if(!v) return null;
  const head = v.split("—")[0].trim().toUpperCase().replace(/^([A-Z]{4})\s*(\w)/,"$1 $2");
  const t = (v.split("—")[1]||"").trim();
  const exact = CATALOG.find(([c,tt]) => shown(c)===head && (!t || tt===t));
  if(exact) return exact[0];
  const byCode = CATALOG.find(([c]) => c===head || c.replace(" ","")===head.replace(" ",""));
  return byCode ? byCode[0] : null;
}

    S.program = prog; S.minor = document.getElementById("sf-minor").value; S.conc = document.getElementById("sf-conc").value;
    ui.openSettings=false; changed();
  } else if(f.id==="classForm"){
    const code = codeFromInput(document.getElementById("cf-code").value);
    const days = [1,2,3,4,5].filter(d=>document.getElementById("cf-d"+d).checked);
    const start = document.getElementById("cf-start").value, end = document.getElementById("cf-end").value;
    if(!code){ ui.err="Pick a course from the list, e.g. MEDA 113."; render(); return; }
    if(!days.length){ ui.err="Choose at least one day."; render(); return; }
    if(end<=start){ ui.err="End time must be after the start time."; render(); return; }
    ui.err="";
    S.classes.push({id:Math.random().toString(36).slice(2,9), code, days, start, end, term:document.getElementById("cf-term").value, room:document.getElementById("cf-room").value.trim().slice(0,30)});
    if(!S.status[code]) S.status[code]="i";
    changed();
  } else if(f.id==="eventForm"){
    const title = document.getElementById("ef-title").value.trim(); const date = document.getElementById("ef-date").value;
    if(!title||!date) return;
    S.events.push({id:Math.random().toString(36).slice(2,9), title:title.slice(0,80), date, time:document.getElementById("ef-time").value||""});
    ui.sel = date; changed();
  }
});
connect();
})();
</script>
